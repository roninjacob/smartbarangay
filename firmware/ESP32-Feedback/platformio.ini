[platformio]
default_envs = esp32dev
build_dir = ~/.smartbarangay/firmware/smartbarangay-feedback-build

[env:esp32dev]
lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library

platform = espressif32@8.0.0
board = esp32dev
framework = arduino

extra_scripts =
    pre:scripts/private_wifi.py

monitor_speed = 115200
upload_speed = 115200
upload_port = COM4
monitor_port = COM4
