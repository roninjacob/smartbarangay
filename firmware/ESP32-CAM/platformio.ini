; SmartBarangay ESP32-CAM scanner (AI Thinker / OV2640).
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32cam
; Firmware binaries embed private credentials: keep every build outside htdocs.
build_dir = ~/.smartbarangay/firmware/smartbarangay-esp32cam-build

; Production scanner: authenticated HTTPS client, ESP-NOW feedback link,
; no unauthenticated LAN images or video.
[env:esp32cam]
platform = espressif32@8.0.0
board = esp32cam
framework = arduino
extra_scripts =
    pre:scripts/private_wifi.py
    pre:scripts/private_iot.py

monitor_speed = 115200
upload_speed = 115200
monitor_dtr = 0
monitor_rts = 0

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; Development only. Explicit opt-in, synthetic/dummy QR only.
; Unauthenticated LAN images/video; the device API client stays disabled.
; Never upload this environment for real reservation credential handling.
[env:esp32cam-diagnostics]
extends = env:esp32cam
build_flags =
    ${env:esp32cam.build_flags}
    -DSB_CAMERA_DIAGNOSTICS=1
